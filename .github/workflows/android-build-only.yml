name: Android Build (Artifacts Only)

on:
  workflow_dispatch:
  pull_request:
    branches: [ development ]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (prodRelease)
        run: ./gradlew :cmp-android:assembleProdRelease --stacktrace

      - name: Build AAB (prodRelease)
        run: ./gradlew :cmp-android:bundleProdRelease --stacktrace

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-prodRelease
          if-no-files-found: error
          path: |
            **/build/outputs/apk/prod/release/*.apk
            **/build/outputs/bundle/prodRelease/*.aab
